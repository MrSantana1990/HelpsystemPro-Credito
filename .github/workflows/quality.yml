name: Qualidade

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validar:
    name: Testes e compilação
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixar código
        uses: actions/checkout@v5

      - name: Preparar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependências reproduzíveis
        run: npm ci

      - name: Validar tipos
        run: npm run typecheck

      - name: Executar testes financeiros
        run: npm test

      - name: Gerar versão de produção
        run: npm run build

  container:
    name: Imagem Docker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: validar

    steps:
      - name: Baixar código
        uses: actions/checkout@v5

      - name: Construir imagem de produção
        run: docker build --tag helpsystempro-credito:test .
